name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # fallback env if Gradle doesn't see gradle.properties
      GITHUB_ACTOR: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # If your submodule repo is private and GITHUB_TOKEN can't read it,
          # create a PAT secret (repo scope) named GH_SUBMODULE_TOKEN and use:
          # token: ${{ secrets.GH_SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Gradle for GitHub Packages
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          gpr.user=${GITHUB_ACTOR}
          gpr.key=${GH_PACKAGES_TOKEN}
          EOF

      - name: Build and test
        run: ./gradlew clean build --no-daemon